# Zentriz Genesis — ambiente local
# Namespace: zentriz-genesis (project name = namespace para recursos Docker)
# Uso: docker compose up -d | Variáveis: .env (DOCKER_NAMESPACE, etc.)

name: zentriz-genesis

services:
  api:
    build:
      context: ./applications/services/api-node
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # IMPORTANTE: dentro do Docker, API_BASE_URL DEVE ser http://api:3000 (nome do serviço).
      # A API envia esse valor ao runner; se for localhost, o runner não consegue gravar diálogo.
      # Colocado APÓS env_file para garantir que sobrescreve o valor do .env.
      - API_BASE_URL=http://api:3000
      # RFC-0004 F4: gate de validação de spec no choke-point — OFF por padrão
      # (byte-idêntico ao legado); ligar = SPEC_VALIDATION_GATE=on (padrão H3/rota B).
      - SPEC_VALIDATION_GATE=${SPEC_VALIDATION_GATE:-off}
      # RFC-0004 D1: auto-validação (watchdog dispara quando a spec estabiliza) — OFF por
      # padrão (manual primeiro); ligar = SPEC_VALIDATION_AUTO=on. Quiet configurável.
      - SPEC_VALIDATION_AUTO=${SPEC_VALIDATION_AUTO:-off}
      - SPEC_VALIDATION_AUTO_QUIET_MIN=${SPEC_VALIDATION_AUTO_QUIET_MIN:-2}
      - UPLOAD_DIR=/shared/uploads
      - RUNNER_SERVICE_URL=http://runner:8001
      - GITHUB_APP_PRIVATE_KEY_FILE=/run/secrets/zentriz-autonomy.2026-04-24.private-key.pem
      # Fixo: dentro do container sempre /project-files; bind mount mapeia para o host
      - PROJECT_FILES_ROOT=/project-files
      # api e runner compartilham o mesmo volume /shared/uploads — path-based delivery (sem base64)
      - RUNNER_UPLOAD_DIR=/shared/uploads
      # Path do host para project-files — usado pelo watchdog e para exibição ao usuário
      - HOST_PROJECT_FILES_ROOT=${HOST_PROJECT_FILES_ROOT:-/Users/mac/zentriz-files}
      - PGHOST=${PGHOST:?PGHOST nao definido no .env}
      - PGUSER=${PGUSER:?PGUSER nao definido no .env}
      - PGPASSWORD=${PGPASSWORD:?PGPASSWORD nao definido no .env}
      - PGDATABASE=${PGDATABASE:?PGDATABASE nao definido no .env}
      - PGPORT=${PGPORT:-5432}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET nao definido no .env}
      # Telegram Bot (FT-09) — deixar vazio para desabilitar notificações
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_WEBHOOK_PATH=${TELEGRAM_WEBHOOK_PATH:-wh/change-me}
      # FT-17: API precisa chamar full-test-server no host (:7878) para deploy S3
      - FULL_TEST_SERVER_URL=${FULL_TEST_SERVER_URL:-http://host.docker.internal:7878}
      - FTS_AUTH_TOKEN=${FTS_AUTH_TOKEN:-}
      # #74/#60/#61: integração com o Deadpool co-locado (rede interna do compose).
      # Vazio = integração OFF (painel /deadpool degrada limpo, available:false). Prod seta no .env.
      - DEADPOOL_BASE_URL=${DEADPOOL_BASE_URL:-}
      - DEADPOOL_API_TOKEN=${DEADPOOL_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zentriz-genesis_uploads:/shared/uploads
      - ${HOST_PROJECT_FILES_ROOT:-./zentriz-files}:/project-files
      - ${HOME}/Documents/zentriz/github:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    # F3: trocado para imagem com pgvector pré-instalado para RAG (lessons_embeddings).
    # Compatível 100% com postgres:16-alpine (mesma base + extensão "vector").
    # Migration 026 faz CREATE EXTENSION IF NOT EXISTS vector — torna-se no-op em ambientes sem pgvector somente quando RAG_ENABLED!=live.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis_dev
      POSTGRES_DB: zentriz_genesis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zentriz-genesis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d zentriz_genesis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - zentriz-genesis_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  agents:
    build:
      context: .
      dockerfile: applications/orchestrator/agents/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # RFC-0004 F6/T2.1: dentro do Docker o agents fala com a api pelo nome do serviço —
      # sem isto, o .env (localhost:3000) vazava e o report de usage do splitter falhava.
      - API_BASE_URL=http://api:3000
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-900}
      - REQUEST_TIMEOUT_MAX=${REQUEST_TIMEOUT_MAX:-7200}
      - SHOW_TRACEBACK=${SHOW_TRACEBACK:-true}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      # T01: AWS_PROFILE removido do compose. Se necessário, definir via .env
      # (não usar ${AWS_PROFILE:-} — string vazia quebra boto3 com ProfileNotFound).
      - GENESIS_LLM_PROVIDER=${GENESIS_LLM_PROVIDER:-anthropic}
      - GENESIS_AWS_REGION=${GENESIS_AWS_REGION:-us-east-1}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-32000}
      - CLAUDE_MAX_TOKENS_ENGINEER=${CLAUDE_MAX_TOKENS_ENGINEER:-32000}
      - CLAUDE_MAX_TOKENS_PM=${CLAUDE_MAX_TOKENS_PM:-32000}
      - CLAUDE_MAX_TOKENS_DEV=${CLAUDE_MAX_TOKENS_DEV:-32000}
      - CLAUDE_MAX_TOKENS_QA=${CLAUDE_MAX_TOKENS_QA:-16000}
      - CLAUDE_MAX_TOKENS_SPEC_INTAKE=${CLAUDE_MAX_TOKENS_SPEC_INTAKE:-64000}
      - CLAUDE_MAX_TOKENS_DEV_REWORK=${CLAUDE_MAX_TOKENS_DEV_REWORK:-48000}
      - CLAUDE_RETRY_ATTEMPTS=${CLAUDE_RETRY_ATTEMPTS:-3}
      - MAX_REPAIRS=${MAX_REPAIRS:-2}
      - CIRCUIT_BREAKER_THRESHOLD=${CIRCUIT_BREAKER_THRESHOLD:-3}
      - GENESIS_API_TOKEN=${GENESIS_API_TOKEN:-}
      - GENESIS_API_URL=http://api:3000
      - PROJECT_FILES_ROOT=/project-files
      - HOST_PROJECT_FILES_ROOT=${HOST_PROJECT_FILES_ROOT:-/Users/mac/zentriz-files}
      # R4 PR5: o splitter (product_architect) valida o connect.yaml contra o schema Connect —
      # sem o repo irmão montado a validação era silenciosamente nula (só o runner montava).
      - ZENTRIZ_CONNECT_ROOT=/zentriz-connect
    env_file:
      - .env
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
      - ${HOST_PROJECT_FILES_ROOT:-./zentriz-files}:/project-files
      - ${ZENTRIZ_CONNECT_PATH:-../zentriz-connect}:/zentriz-connect:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: applications/orchestrator/Dockerfile.runner
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - API_AGENTS_URL=${API_AGENTS_URL:-http://agents:8000}
      # APÓS env_file para sobrescrever localhost do .env
      - API_BASE_URL=http://api:3000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-900}
      - REQUEST_TIMEOUT_MAX=${REQUEST_TIMEOUT_MAX:-7200}
      - SHOW_TRACEBACK=${SHOW_TRACEBACK:-true}
      - AGENT_TIMEOUT_ENGINEER=${AGENT_TIMEOUT_ENGINEER:-900}
      - AGENT_TIMEOUT_CTO=${AGENT_TIMEOUT_CTO:-900}
      - AGENT_TIMEOUT_PM=${AGENT_TIMEOUT_PM:-900}
      - AGENT_TIMEOUT_DEV=${AGENT_TIMEOUT_DEV:-900}
      - AGENT_TIMEOUT_QA=${AGENT_TIMEOUT_QA:-600}
      - AGENT_TIMEOUT_MONITOR=${AGENT_TIMEOUT_MONITOR:-600}
      - AGENT_TIMEOUT_DEVOPS=${AGENT_TIMEOUT_DEVOPS:-900}
      - AGENT_HTTP_RETRY_ON_TIMEOUT=${AGENT_HTTP_RETRY_ON_TIMEOUT:-2}
      - MAX_QA_REWORK=${MAX_QA_REWORK:-3}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-32000}
      - CLAUDE_MAX_TOKENS_ENGINEER=${CLAUDE_MAX_TOKENS_ENGINEER:-32000}
      - CLAUDE_MAX_TOKENS_PM=${CLAUDE_MAX_TOKENS_PM:-32000}
      - CLAUDE_MAX_TOKENS_DEV=${CLAUDE_MAX_TOKENS_DEV:-32000}
      - CLAUDE_MAX_TOKENS_QA=${CLAUDE_MAX_TOKENS_QA:-16000}
      - CLAUDE_MAX_TOKENS_DEV_REWORK=${CLAUDE_MAX_TOKENS_DEV_REWORK:-48000}
      # Fixo: dentro do container sempre /project-files; bind mount mapeia para o host
      - PROJECT_FILES_ROOT=/project-files
      - PIPELINE_FULL_STACK=${PIPELINE_FULL_STACK:-true}
      - ZENTRIZ_CONNECT_ROOT=/zentriz-connect
      # Host path dos project files — usado pelo runner para instrução de execução local
      - HOST_PROJECT_FILES_ROOT=${HOST_PROJECT_FILES_ROOT:-/Users/mac/zentriz-files}
      # GAP-P6: token para o runner sincronizar métricas (complexity_hint, run_count) com a API
      - GENESIS_API_TOKEN=${GENESIS_API_TOKEN:-}
      - GENESIS_API_URL=http://api:3000
      # TASK-FULL-TEST: path do Claude Code CLI no host (montado via bind-mount abaixo)
      - CLAUDE_BIN=${CLAUDE_BIN:-/host-claude/claude}
      # TASK-FULL-TEST: URL do full-test-server.py rodando no host
      - FULL_TEST_SERVER_URL=http://host.docker.internal:7878
      - FTS_AUTH_TOKEN=${FTS_AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zentriz-genesis_uploads:/shared/uploads
      - ${HOST_PROJECT_FILES_ROOT:-./zentriz-files}:/project-files
      - ${HOST_PROJECT_FILES_ROOT:-./zentriz-files}/.runner-state:/orchestrator/state
      - ${HOME}/.aws:/root/.aws:ro
      - ${ZENTRIZ_CONNECT_PATH:-../zentriz-connect}:/zentriz-connect:ro
    depends_on:
      - agents
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # FT-14: Zentriz Cyborg — aceita projetos automaticamente após pipeline completar
  # Modo Produto: definir CYBORG_PRODUCT_ID para monitorar produto específico
  # Modo Solitário: deixar CYBORG_PRODUCT_ID vazio para monitorar todos os projetos standalone
  cyborg:
    build:
      context: .
      dockerfile: applications/orchestrator/Dockerfile.runner
    command: ["python3", "-m", "orchestrator.zentriz_cyborg"]
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:3000
      - GENESIS_API_TOKEN=${GENESIS_API_TOKEN:-}
      - PROJECT_FILES_ROOT=/project-files
      - CYBORG_POLL_INTERVAL=${CYBORG_POLL_INTERVAL:-60}
      - CYBORG_MAX_FIX_CYCLES=${CYBORG_MAX_FIX_CYCLES:-2}
      - CYBORG_PLAYBOOK_TIMEOUT=${CYBORG_PLAYBOOK_TIMEOUT:-300}
      - CYBORG_PRODUCT_ID=${CYBORG_PRODUCT_ID:-}
      - FTS_AUTH_TOKEN=${FTS_AUTH_TOKEN:-}
    volumes:
      - ${HOST_PROJECT_FILES_ROOT:-./zentriz-files}:/project-files
      - zentriz-genesis_uploads:/shared/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - runner
    restart: unless-stopped

  # #74: Zentriz Deadpool — sustainment plane CO-LOCADO no stack do Genesis.
  # Produto independente (ADR-001): fala com a api SOMENTE pela rede interna do
  # compose (http://deadpool:8787) — SEM porta pública mapeada. Storage self-contained
  # (json) em volume nomeado. Modos perigosos ficam OFF (plan/stub) salvo decisão explícita.
  # Defaults locais seguros (app_env=local, sem token); prod seta via .env:
  #   DEADPOOL_APP_ENV=production, DEADPOOL_API_ENABLE_TOKEN_AUTH=true,
  #   DEADPOOL_API_ENABLE_BASIC_AUTH=false, DEADPOOL_API_TOKEN=<secret>.
  deadpool:
    build:
      context: ../zentriz-deadpool-auto-care
      dockerfile: deploy/docker/Dockerfile
    # Durabilidade do monitoramento multi-tenant (fork A + fork B): env extra que vive SÓ no host de
    # prod em /opt/zentriz-genesis/.env.deadpool-aws (root:600, NUNCA commitado — contém chaves AWS
    # do tenant p/ cross-account CloudWatch + CREDENTIALS_ENCRYPTION_KEY do path de chaves estáticas
    # do fork B). Antes esta referência existia só no working-tree de prod → um git checkout/reset em
    # /opt a perderia. required:false garante que dev/local (sem o arquivo) não quebre.
    env_file:
      - path: .env.deadpool-aws
        required: false
    environment:
      - DEADPOOL_APP_ENV=${DEADPOOL_APP_ENV:-local}
      # 0.0.0.0: alcançável pela api via nome de serviço (127.0.0.1 só ligaria o loopback interno).
      - DEADPOOL_API_HOST=0.0.0.0
      - DEADPOOL_API_PORT=8787
      - DEADPOOL_STATE_DIR=/data
      - DEADPOOL_STORE_KIND=${DEADPOOL_STORE_KIND:-json}
      # Raiz dos schemas do Connect DENTRO do container (montada em read-only abaixo). Sem ela,
      # resolve_connect_schema_root() levanta ConnectContractError e QUALQUER /diagnose que traga
      # contexto Connect (serviceManifest/ownershipManifest/integrationReadyContract) responde 400.
      # Habilita a validação Connect e o perfil de suporte (tier1-connect-ready) no gateway.
      - DEADPOOL_CONNECT_ROOT=/zentriz-connect
      # ADR-013 (auditoria 2026-09-02, Onda 3.3): consumo VERSIONADO fail-closed do Connect —
      # valida contra o snapshot congelado .snapshots/v<pin>, nunca a pasta live de dev.
      # Estas envs PRECISAM estar aqui: o container não carrega o .env (env_file é só o
      # .env.deadpool-aws) — setar só no .env seria no-op silencioso.
      - DEADPOOL_ALLOW_CONNECT_VERSIONED=${DEADPOOL_ALLOW_CONNECT_VERSIONED:-false}
      - CONNECT_VERSION_PIN=${CONNECT_VERSION_PIN:-1.1.0}
      # A matriz do consumidor é embarcada na imagem em /app/compatibility (Dockerfile);
      # dentro do container o pacote instalado não a encontraria sozinho.
      - DEADPOOL_COMPAT_MATRIX_FILE=/app/compatibility/connect-compatibility.json
      # Auth: em prod, token-only (basic desligado). Local herda defaults (não-protegido → validação leve).
      # DEADPOOL_API_ENABLE_AUTH=false só é permitido fora de prod (config.py) — usado no local p/ o gateway alcançar sem token.
      - DEADPOOL_API_ENABLE_AUTH=${DEADPOOL_API_ENABLE_AUTH:-true}
      - DEADPOOL_API_ENABLE_TOKEN_AUTH=${DEADPOOL_API_ENABLE_TOKEN_AUTH:-false}
      - DEADPOOL_API_ENABLE_BASIC_AUTH=${DEADPOOL_API_ENABLE_BASIC_AUTH:-true}
      - DEADPOOL_API_TOKEN=${DEADPOOL_API_TOKEN:-}
      # Salvaguardas: sem efeitos colaterais reais salvo opt-in explícito no .env.
      - DEADPOOL_EXECUTION_MODE=${DEADPOOL_EXECUTION_MODE:-plan}
      - DEADPOOL_ALLOW_LIVE_LLM_CALLS=${DEADPOOL_ALLOW_LIVE_LLM_CALLS:-false}
      - DEADPOOL_ALLOW_NETWORK_CLONE=${DEADPOOL_ALLOW_NETWORK_CLONE:-false}
      - DEADPOOL_ALLOW_LIVE_GITHUB_CALLS=${DEADPOOL_ALLOW_LIVE_GITHUB_CALLS:-false}
    volumes:
      - zentriz-genesis_deadpool_state:/data
      # D-A1 (decisão do Jean, 2026-09-05): working trees que o Genesis git-linka. A api registra
      # `localPath = ${PROJECT_FILES_ROOT}/<projectId>/apps` = `/project-files/<id>/apps`; sem este
      # mount `Path(local_path).is_dir()` é FALSO dentro do container (service.py:513) e a remediação
      # cai em clone de rede — desligado (DEADPOOL_ALLOW_NETWORK_CLONE=false) → dry-run silencioso.
      # Mesmo path absoluto dos demais serviços (api/agents/runner montam este volume em
      # /project-files) — é o path que viaja no payload de registro, não pode divergir.
      # Read-WRITE de propósito: a remediação cria a branch `deadpool/<incidente>` e escreve na
      # árvore. Efeito colateral real segue barrado por DEADPOOL_EXECUTION_MODE=plan +
      # DEADPOOL_ALLOW_LIVE_GITHUB_CALLS=false (acima).
      - ${HOST_PROJECT_FILES_ROOT:-./zentriz-files}:/project-files
      # Schemas do Connect em read-only (mesmo idioma do runner, linha ~198): em prod o default
      # ../zentriz-connect resolve para /opt/zentriz-connect (pasta irmã de /opt/zentriz-genesis);
      # em dev/local resolve para a pasta irmã do repo. Consumido por DEADPOOL_CONNECT_ROOT acima.
      - ${ZENTRIZ_CONNECT_PATH:-../zentriz-connect}:/zentriz-connect:ro
    healthcheck:
      # /health é isento de auth (http_server retorna antes do _check_auth) — funciona sem token.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8787/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  cag-seed:
    # Serviço one-shot: popula context_cache com bug checklists CAG.
    # Roda uma vez após a API estar healthy e encerra (restart: no).
    # Idempotente: ON CONFLICT DO UPDATE — seguro re-executar.
    image: postgres:16-alpine
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CONNECT_VERSION_PIN=${CONNECT_VERSION_PIN:-1.1.0}
      - PGPASSWORD=${PGPASSWORD}
    volumes:
      - ./scripts/cag_seed.sql:/tmp/cag_seed.sql:ro
    command: >
      sh -c "psql -h $${PGHOST} -U $${PGUSER} -d $${PGDATABASE} -f /tmp/cag_seed.sql &&
             echo '[cag-seed] checklists inseridos com sucesso'"
    restart: "no"

  genesis-web:
    build:
      context: ./applications/apps/genesis-web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      # Server-side proxy: Next.js encaminha /api/* → api:3000 (nome do serviço no Docker network).
      # Browser sempre usa URL relativa. Bundle NUNCA contém URL absoluta. Ver next.config.mjs.
      - NEXT_INTERNAL_API_URL=http://api:3000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  zentriz-genesis_pgdata:
  zentriz-genesis_redis:
  zentriz-genesis_uploads:
  zentriz-genesis_deadpool_state:
