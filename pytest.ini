[pytest]
# `applications/orchestrator` é um namespace package (não tem `__init__.py`), então os testes só
# importam `orchestrator.*` se `applications/` estiver no sys.path. Sem isto, rodar pytest a partir
# da RAIZ do repo quebrava a coleção inteira em `ModuleNotFoundError: No module named 'orchestrator'`
# — e, por ser erro de COLETA, derrubava a suíte toda, não só o arquivo afetado.
#
# `pythonpath` é resolvido a partir do rootdir, então funciona tanto rodando da raiz quanto de
# dentro de `applications/`.
pythonpath = applications
