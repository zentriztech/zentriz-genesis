# CI de evolução (plano EVOLUIR-PROJETO, tarefa 0.2) — vitest + pytest + Postgres efêmero + front.
# Estado: PREPARADO (nunca executado no GitHub Actions); cada comando foi reproduzido localmente —
# ver project/docs/analysis/EVOLUIR-PROJETO-G-fase0-ci-e-front.md.
# Convive com ci.yml (que segue só em `main`); o job `api-node` de lá fica redundante e pode ser
# removido quando este workflow for adotado. Sem segredos: nada aqui usa `secrets.*`.
name: ci-evolution

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-evolution-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-node:
    name: api-node (tsc + vitest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: applications/services/api-node
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test # senha descartável do container efêmero do job
        ports:
          - 55432:5432 # os testes recusam qualquer URL que não seja localhost:55432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: applications/services/api-node/package-lock.json
      - run: npm ci
      # DATABASE_URL só neste passo: com ela definida, src/integration.test.ts deixa o modo em
      # memória e passa a exigir o seed de produção (login 401). Os testes *.pg.integration usam
      # apenas PG_TEST_URL.
      - name: Migrations 1 -> última (mesmo runner do produto)
        env:
          DATABASE_URL: postgres://postgres:test@localhost:55432/postgres
        run: npx tsx scripts/apply-migrations-test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Vitest completo (com PG_TEST_URL, testes *.pg.integration rodam)
        env:
          PG_TEST_URL: postgres://postgres:test@localhost:55432/postgres
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Lint (informativo — débito pré-existente, não bloqueia)
        continue-on-error: true
        run: npm run lint

  orchestrator:
    name: orchestrator (pytest, falhas de ambiente conhecidas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            applications/orchestrator/agents/requirements.txt
            applications/orchestrator/agents/constraints.txt
      - name: Dependências (as mesmas pinadas da imagem agents/runner + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r applications/orchestrator/agents/requirements.txt \
                      -c applications/orchestrator/agents/constraints.txt pytest
      - name: pytest (falha se surgir falha fora de tests/known-env-failures.txt)
        run: >-
          python scripts/ci/pytest_known_failures.py --
          applications/orchestrator/tests -q -p no:cacheprovider

  genesis-web:
    name: genesis-web (tsc + lint + vitest + build + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: applications/apps/genesis-web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: applications/apps/genesis-web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testes de unidade e de componente (Vitest + RTL + jsdom)
        run: npm test
      - name: Build
        run: npm run build
      - name: Chromium para o E2E
        run: npx playwright install --with-deps chromium
      - name: E2E headless (API simulada, sem login real)
        run: npm run test:e2e
